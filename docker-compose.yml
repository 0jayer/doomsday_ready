services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: doomsday
      POSTGRES_PASSWORD: doomsday
      POSTGRES_DB: doomsday
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doomsday"]
      interval: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://doomsday:doomsday@db:5432/doomsday
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata: